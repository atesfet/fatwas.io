<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FatWAS Plot</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    #plot { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="plot"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const metric = (params.get('metric') || 'SFI').toUpperCase();
    const type = (params.get('type') || 'manhattan').toLowerCase();

    let allData = [];
    let focusedPhenotype = '';

    function toNum(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function parsePValue(raw) {
      const s = String(raw || '').trim();
      if (!s) {
        return null;
      }

      if (s[0] === '<') {
        const n = Number(s.slice(1).trim());
        if (Number.isFinite(n) && n > 0) {
          return n / 2;
        }
      }

      const n = Number(s);
      if (!Number.isFinite(n)) {
        return null;
      }
      if (n <= 0) {
        return 1e-300;
      }
      return n;
    }

    function toPValueFromRow(row) {
      return parsePValue(row.p) || 1e-300;
    }

    function normalizePhenotype(value) {
      const s = String(value || '').trim();
      if (/^\d+(?:\.\d+)?$/.test(s)) {
        const parts = s.split('.');
        let intPart = parts[0].replace(/^0+(?=\d)/, '');
        if (!intPart) {
          intPart = '0';
        }
        if (parts.length === 1) {
          return intPart;
        }
        const fracPart = parts[1].replace(/0+$/, '');
        return fracPart ? (intPart + '.' + fracPart) : intPart;
      }
      return s;
    }

    function plotTitle() {
      return metric + ' ' + (type === 'volcano' ? 'Volcano Plot' : 'Manhattan Plot');
    }

    function focusLabel() {
      if (!focusedPhenotype) {
        return '';
      }
      const hit = allData.find(function(r) {
        return normalizePhenotype(r.phenotype) === focusedPhenotype;
      });
      const desc = hit && hit.description ? String(hit.description).trim() : '';
      return (hit ? hit.phenotype : focusedPhenotype) + (desc ? (' - ' + desc) : '');
    }

    function render() {
      const filtered = allData
        .filter(r => (r.metric || '').toUpperCase() === metric)
        .map(r => ({
          phenotype: normalizePhenotype(r.phenotype),
          label: r.phenotype || '',
          code: toNum(r.phenotype),
          description: r.description || '',
          group: r.group || '',
          color: r.color || 'gray',
          p: toPValueFromRow(r),
          p_display: r.p_display || '',
          significant: r.significant === 'yes',
          or: toNum(r.OR),
          or_ci: r.OR_CI || '',
          n_cases: r.n_cases || '',
          groupnum: toNum(r.groupnum)
        }))
        .filter(r => r.p && r.or);

      // Manhattan order: phecode group, then phecode.
      filtered.sort((a, b) => (a.groupnum || 999) - (b.groupnum || 999) || (a.code || 0) - (b.code || 0));

      const mapped = filtered.map((r, idx) => {
        const y = -Math.log10(r.p);
        const x = type === 'volcano' ? Math.log2(r.or) : (idx + 1);
        return {
          x: x,
          y: y,
          text: r.description + '<br>Phenotype: ' + r.label + '<br>Group: ' + r.group +
            '<br>OR (95% CI): ' + r.or_ci + '<br>p: ' + r.p_display + '<br>Cases: ' + r.n_cases +
            '<br>Bonferroni-significant: ' + (r.significant ? 'yes' : 'no'),
          color: r.color,
          significant: r.significant,
          group: r.group,
          phenotype: r.phenotype
        };
      });

      const others = mapped.filter(r => !focusedPhenotype || r.phenotype !== focusedPhenotype);
      const focus = mapped.filter(r => focusedPhenotype && r.phenotype === focusedPhenotype);
      const dim = focusedPhenotype ? 0.5 : 1;

      function pointTrace(rows, sig) {
        return {
          x: rows.map(r => r.x),
          y: rows.map(r => r.y),
          mode: 'markers',
          type: 'scatter',
          marker: sig
            ? { size: 7, color: rows.map(r => r.color), opacity: 0.85 * dim }
            : { size: 5, color: '#9a9a9a', opacity: 0.35 * dim },
          text: rows.map(r => r.text),
          hovertemplate: '%{text}<extra></extra>',
          name: sig ? 'Bonferroni-significant' : 'Not significant',
          showlegend: false
        };
      }

      const traces = [
        pointTrace(others.filter(r => !r.significant), false),
        pointTrace(others.filter(r => r.significant), true)
      ];

      if (focus.length) {
        traces.push({
          x: focus.map(r => r.x),
          y: focus.map(r => r.y),
          mode: 'markers',
          type: 'scatter',
          marker: {
            size: 12,
            color: '#111',
            symbol: 'diamond',
            line: { color: '#ffcc00', width: 2 },
            opacity: 1
          },
          text: focus.map(r => r.text),
          hovertemplate: '%{text}<extra>Focused phenotype</extra>',
          name: 'Focused phenotype'
        });
      }

      // Bonferroni threshold across all marker-phenotype tests in the file (0.05 / 2,496).
      const bonf = 0.05 / allData.length;
      const xaxis = { title: type === 'volcano' ? 'log2(Odds Ratio per SD)' : 'Phenotype group', zeroline: type === 'volcano' };
      if (type !== 'volcano') {
        const ticks = [];
        let start = 0;
        for (let i = 1; i <= mapped.length; i++) {
          if (i === mapped.length || mapped[i].group !== mapped[start].group) {
            ticks.push({ pos: (mapped[start].x + mapped[i - 1].x) / 2, label: mapped[start].group });
            start = i;
          }
        }
        xaxis.tickvals = ticks.map(t => t.pos);
        xaxis.ticktext = ticks.map(t => t.label);
        xaxis.tickangle = -45;
        xaxis.showgrid = false;
      }
      const yaxis = { title: '-log10(p)', rangemode: 'tozero' };

      const focusSig = focus.some(r => r.significant);
      const layout = {
        title: plotTitle() + (focusedPhenotype ? ' (Focus: ' + focusLabel() + ')' : ''),
        xaxis: xaxis,
        yaxis: yaxis,
        annotations: (focusedPhenotype && !focusSig) ? [{
          xref: 'paper',
          yref: 'paper',
          x: 0.5,
          y: 0.5,
          xanchor: 'center',
          yanchor: 'middle',
          text: focus.length ? ('Focused phenotype not Bonferroni-significant for ' + metric) : ('Focused phenotype not tested for ' + metric),
          showarrow: false,
          font: { size: 14, color: '#8b0000' },
          bgcolor: 'rgba(255,245,245,0.96)',
          bordercolor: '#a40000',
          borderwidth: 2,
          borderpad: 10
        }] : [],
        shapes: [{
          type: 'line',
          xref: 'paper', yref: 'y',
          x0: 0, x1: 1,
          y0: -Math.log10(bonf), y1: -Math.log10(bonf),
          line: { color: 'red', width: 1.5, dash: 'dash' }
        }],
        margin: { l: 60, r: 20, t: 60, b: type === 'volcano' ? 60 : 130 }
      };

      Plotly.newPlot('plot', traces, layout, { responsive: true, displaylogo: false });
    }

    function exportImage(requestId) {
      const exportWidth = 2200;
      const exportHeight = 1300;
      Plotly.toImage('plot', {
        format: 'png',
        width: exportWidth,
        height: exportHeight,
        scale: 2
      }).then(function(dataUrl) {
        window.parent.postMessage({
          type: 'exportImageResult',
          requestId: requestId,
          plotId: metric + '_' + type,
          title: plotTitle() + (focusedPhenotype ? ' (Focus: ' + focusLabel() + ')' : ''),
          dataUrl: dataUrl,
          width: exportWidth,
          height: exportHeight
        }, '*');
      }).catch(function(err) {
        window.parent.postMessage({
          type: 'exportImageResult',
          requestId: requestId,
          plotId: metric + '_' + type,
          error: String(err)
        }, '*');
      });
    }

    window.addEventListener('message', function(event) {
      const msg = event.data || {};
      if (msg.type === 'focusPhenotype') {
        focusedPhenotype = normalizePhenotype(msg.phenotype);
        render();
      }
      if (msg.type === 'exportImage') {
        focusedPhenotype = normalizePhenotype(msg.phenotype);
        render();
        setTimeout(function() { exportImage(msg.requestId); }, 100);
      }
    });

    Papa.parse('data/all_associations.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allData = results.data;
        render();
      }
    });
  </script>
</body>
</html>
